[package]
name = "qorx"
version = "1.0.6"
edition = "2021"
autobins = false
authors = ["Marvin Sarreal Villanueva <marvin@orin.work>"]
description = "Qorx programming language, compiler, bytecode runtime, and local context resolver."
homepage = "https://github.com/bbrainfuckk/qorx"
repository = "https://github.com/bbrainfuckk/qorx"
documentation = "https://github.com/bbrainfuckk/qorx/tree/main/docs/handbook"
readme = "README.md"
license = "AGPL-3.0-only"
keywords = ["qorx", "context", "compiler", "runtime", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "packaging/aur/**",
    "target/**",
    "target-*/**",
    "target-codex-*/**",
    "packages/python/dist/**",
    "packages/python/build/**",
    "packages/python/*.egg-info/**",
    "testsprite_tests/tmp/**",
]

[[bin]]
name = "qorx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = "2.2"
futures-util = "0.3"
getrandom = "0.3"
ml-dsa = { version = "0.1.0-rc.8", default-features = false, features = ["alloc", "rand_core"] }
open = "5.3"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
toml_edit = "0.23"
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
strip = true
debug = false
split-debuginfo = "off"
panic = "abort"
lto = "fat"
codegen-units = 1
