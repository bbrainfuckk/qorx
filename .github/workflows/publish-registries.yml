name: Publish Registries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        default: "v1.0.6"
        type: string

permissions:
  contents: read

jobs:
  crates:
    name: crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Install Rust stable
        run: |
          rustup update stable
          rustup default stable
      - name: Publish crate
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is missing; skipping crates.io publish."
            exit 0
          fi
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          if curl --fail --silent --show-error "https://crates.io/api/v1/crates/qorx/$version" >/dev/null; then
            echo "qorx $version already exists on crates.io; skipping."
            exit 0
          fi
          cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    name: npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Publish npm package
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name $version already exists on npm; skipping."
            exit 0
          fi
          npm publish --access public
        working-directory: packages/npm

  pypi:
    name: PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
        working-directory: packages/python
      - name: Check whether the PyPI version exists
        id: pypi-version
        shell: python
        run: |
          import os, pathlib, tomllib, urllib.error, urllib.request
          data = tomllib.loads(pathlib.Path("packages/python/pyproject.toml").read_text())
          version = data["project"]["version"]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/qorx/{version}/json", timeout=15):
                  pass
              exists = True
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              exists = False
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"exists={str(exists).lower()}", file=output)
      - name: Publish PyPI package with trusted publishing
        if: steps.pypi-version.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
