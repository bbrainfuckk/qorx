name: Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v1.0.5"
        required: true
        default: "v1.0.5"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: qorx.exe
            archive: zip
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: qorx.exe
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: qorx
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: qorx
            archive: tar.gz
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: qorx
            archive: tar.gz
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: qorx
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust stable
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add "${{ matrix.target }}"

      - name: Install Linux cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify compiler bootstrap claim
        shell: pwsh
        run: ./scripts/check-bootstrap.ps1

      - name: Enforce release size
        shell: pwsh
        run: ./scripts/check-release-size.ps1 -Binary "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - name: Smoke test native binary
        if: matrix.name != 'linux-arm64' && matrix.name != 'windows-arm64'
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" --version
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" qorx-check examples/goal.qorx
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" qorx-compile --help

      - name: Stage
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          pkg="qorx-${tag}-${{ matrix.name }}"
          mkdir -p "dist/$pkg/docs"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$pkg/"
          cp README.md LICENSE NOTICE "dist/$pkg/"
          cp docs/COMMANDS.md docs/INSTALL.md docs/DISTRIBUTION.md docs/PRODUCTION.md docs/SERVER.md "dist/$pkg/docs/"
          cp -R docs/releases "dist/$pkg/docs/"
          cp -R docs/handbook "dist/$pkg/docs/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$pkg/*' -DestinationPath 'dist/$pkg.zip' -Force"
            powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 'dist/$pkg.zip').Hash.ToLowerInvariant() + '  $pkg.zip' | Set-Content 'dist/$pkg.zip.sha256' -NoNewline"
          else
            tar -C "dist/$pkg" -czf "dist/$pkg.tar.gz" .
            shasum -a 256 "dist/$pkg.tar.gz" > "dist/$pkg.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qorx-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Attach assets
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "Qorx $tag" --notes "Qorx distribution release."
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
