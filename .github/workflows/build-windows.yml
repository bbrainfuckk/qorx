name: Build Qorx Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Smoke test binary
        shell: pwsh
        run: |
          .\target\release\qorx.exe --version
          .\target\release\qorx.exe index .
          .\target\release\qorx.exe session

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\qorx-windows-x64 -Force | Out-Null
          Copy-Item target\release\qorx.exe dist\qorx-windows-x64\
          Copy-Item README.md dist\qorx-windows-x64\
          Copy-Item docs\COMMANDS.md dist\qorx-windows-x64\

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: qorx-windows-x64
          path: dist/qorx-windows-x64
