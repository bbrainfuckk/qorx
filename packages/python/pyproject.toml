[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qorx"
version = "1.0.5"
description = "Qorx programming language, compiler, bytecode runtime, and local context resolver."
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-only"
authors = [{ name = "Marvin Sarreal Villanueva", email = "marvin@orin.work" }]
maintainers = [{ name = "Marvin Sarreal Villanueva", email = "msarvillan@gmail.com" }]
keywords = ["qorx", "compiler", "runtime", "context", "ai-language"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Compilers"
]

[project.urls]
Homepage = "https://github.com/bbrainfuckk/qorx"
Repository = "https://github.com/bbrainfuckk/qorx"
Issues = "https://github.com/bbrainfuckk/qorx/issues"

[project.scripts]
qorx = "qorx.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qorx"]
