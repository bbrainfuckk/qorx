name: qorx
base: core24
version: "1.0.5"
summary: Qorx AI-native language and runtime for local context resolution
description: |
  Qorx is an AI-native programming language and local runtime for context resolution.

grade: stable
confinement: strict

apps:
  qorx:
    command: bin/qorx
    plugs:
      - home
      - network
      - network-bind

parts:
  qorx:
    plugin: rust
    source: .
    build-packages:
      - pkg-config
